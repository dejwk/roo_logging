name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_test:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@19dda59607baa11ee15a129da6de0300924e84d2 # roo_testing 2.5.0
    with:
      profiles: '["arduino", "idf", "arduino_esp32s3", "idf_esp32s3", "arduino_esp32c3", "idf_esp32c3", "pico_rp2040", "arduino_rp2040", "arduino_rp2040_freertos"]'
      run_tests: true
